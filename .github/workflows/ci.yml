name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # postgis/postgis rather than plain postgres: the extensions migration
      # and every geometry field depend on it.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: skillshub
          POSTGRES_PASSWORD: skillshub
          POSTGRES_DB: skillshub
        options: >-
          --health-cmd "pg_isready -U skillshub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgis://skillshub:skillshub@localhost:5432/skillshub
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # GeoDjango needs the native libraries; pip cannot supply them. ffmpeg
      # is for the video tests, which encode real clips.
      - name: Install GDAL, GEOS, PROJ and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev binutils ffmpeg

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      # A migration that exists only on someone's laptop breaks the next
      # deploy, so drift fails the build here instead.
      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint src

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_BRAND_NAME: Fliptech

  browser:
    # The Playwright suite in frontend/e2e, against a production build talking
    # to a real API with the demo data in it. Includes Section 10's search-page
    # budgets — under 200 KB, first paint under three seconds on 3G; see
    # e2e/budget.spec.ts. The page passed with about 6 KB to spare when that was
    # added, so this is what notices when the next client component takes it.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: skillshub
          POSTGRES_PASSWORD: skillshub
          POSTGRES_DB: skillshub
        options: >-
          --health-cmd "pg_isready -U skillshub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      # The API caches in Redis outside the test suite.
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgis://skillshub:skillshub@localhost:5432/skillshub
      REDIS_URL: redis://localhost:6379/0
      SMS_PROVIDER: console
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BRAND_NAME: Fliiptech
      PUBLIC_SITE_URL: http://127.0.0.1:3000
      BACK_OFFICE_URL: http://127.0.0.1:8000
      # A throwaway account in a database that exists for this job only.
      ADMIN_E2E_USERNAME: e2e-admin
      ADMIN_E2E_PASSWORD: ci-only-e2e-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install GDAL, GEOS and PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev binutils

      - name: Start the API with the demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
          DJANGO_SUPERUSER_PASSWORD="$ADMIN_E2E_PASSWORD" python manage.py createsuperuser \
            --noinput --username "$ADMIN_E2E_USERNAME" --email e2e@example.com
          nohup python manage.py runserver 127.0.0.1:8000 > runserver.log 2>&1 &

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build and start the site
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start --port 3000 > next.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 2
          done

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests, budgets included
        working-directory: frontend
        run: pnpm test:e2e

      - name: Server logs
        if: failure()
        run: |
          tail -n 50 backend/runserver.log
          tail -n 50 frontend/next.log

  images:
    # Only proves the images build. Pushing and deploying is deliberately a
    # separate, manual step until there is a staging environment to prove a
    # release against.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://example.com
            NEXT_PUBLIC_SITE_URL=https://example.com
            NEXT_PUBLIC_BRAND_NAME=Fliptech
